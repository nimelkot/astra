[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "astra-code-context"
version = "0.1.0"
description = "Hybrid structural and semantic codebase intelligence for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "mcp[cli]>=2.0.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
astra = "astra.cli:app"
astra-mcp = "astra.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["astra"]

[tool.hatch.build.targets.wheel.force-include]
"assets/astra-icon-light.png" = "astra/assets/astra-icon-light.png"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
